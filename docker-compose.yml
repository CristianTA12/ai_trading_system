services:
  # === Base de datos principal ===
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    volumes:
      - ${DATA_DIR:-/data}/timescaledb:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Cache y estado en tiempo real ===
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_DIR:-/data}/redis:/data
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Experiment tracking ===
  mlflow:
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: trading-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading_secret}@timescaledb:5432/${POSTGRES_DB:-trading_db}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - ${DATA_DIR:-/data}/mlflow:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading_secret}@timescaledb:5432/${POSTGRES_DB:-trading_db}
      --default-artifact-root /mlflow/artifacts
    depends_on:
      timescaledb:
        condition: service_healthy

  # === Monitoring y dashboards ===
  grafana:
    image: grafana/grafana:latest
    container_name: trading-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ${DATA_DIR:-/data}/grafana:/var/lib/grafana
      - ./dashboards/grafana:/etc/grafana/provisioning/dashboards
    depends_on:
      timescaledb:
        condition: service_healthy

  # === LLM local ===
  ollama:
    image: ollama/ollama:latest
    container_name: trading-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${DATA_DIR:-/data}/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Para descargar el modelo tras arrancar:
    # docker exec trading-ollama ollama pull qwen2.5:14b

  # === Prometheus (métricas del sistema) ===
  prometheus:
    image: prom/prometheus:latest
    container_name: trading-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${DATA_DIR:-/data}/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
